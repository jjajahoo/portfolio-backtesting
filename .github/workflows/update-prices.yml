name: Update price data

# 웹 버전(web/)에 싣는 시세 파일 data/prices.json을 새로 받는다.
# 종목 목록이나 스크립트가 바뀌면 자동으로, 그 밖에는 Actions 탭에서 직접 실행한다.
on:
  push:
    paths:
      - backtester/catalog.py
      - scripts/fetch_prices.py
      - .github/workflows/update-prices.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "yfinance>=0.2.54" "pandas>=2.2" numpy
      - run: python scripts/fetch_prices.py
      - name: Commit price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet && exit 0
          git commit -m "Update price data"
          git push
